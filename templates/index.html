<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimplifIQ — AI Readiness Audit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0D1B2A;
      --teal:   #00B4D8;
      --teal2:  #0077B6;
      --bg:     #F0F4F8;
      --muted:  #6B7A8D;
      --border: #CBD5E1;
      --white:  #FFFFFF;
      --error:  #EF4444;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--navy);
      min-height: 100vh;
    }

    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    /* ── Left panel — just logo + tagline ── */
    .panel-left {
      background: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      height: 100vh;
      gap: 14px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-mark {
      width: 38px; height: 38px;
      background: var(--teal);
      border-radius: 8px;
      display: grid;
      place-items: center;
    }
    .logo-mark svg { width: 20px; height: 20px; }
    .logo-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: var(--white);
      letter-spacing: -.3px;
    }
    .tagline {
      font-size: 14px;
      color: rgba(255,255,255,.45);
      text-align: center;
    }

    /* ── Right panel ── */
    .panel-right {
      padding: 60px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }

    .form-header { margin-bottom: 36px; }
    .form-header h2 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 26px;
      color: var(--navy);
      margin-bottom: 8px;
      letter-spacing: -.3px;
    }
    .form-header p { font-size: 14px; color: var(--muted); }

    .form-card {
      background: var(--white);
      border-radius: 18px;
      padding: 40px;
      box-shadow:
        0 1px 3px rgba(0,0,0,.04),
        0 8px 32px rgba(13,27,42,.06),
        0 0 0 1px rgba(203,213,225,.5);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .field { margin-bottom: 20px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--navy);
      margin-bottom: 7px;
    }
    label .req { color: var(--teal); margin-left: 3px; }

    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--navy);
      background: #FAFBFC;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
    }
    input::placeholder, textarea::placeholder { color: #B0BAC5; }
    input:focus, select:focus, textarea:focus {
      border-color: var(--teal);
      background: var(--white);
      box-shadow: 0 0 0 3.5px rgba(0,180,216,.1);
    }
    input.error, select.error, textarea.error { border-color: var(--error); }

    .field-error {
      font-size: 12px;
      color: var(--error);
      margin-top: 5px;
      display: none;
    }
    .field-error.visible { display: block; }

    select { cursor: pointer; }
    textarea { resize: vertical; min-height: 96px; line-height: 1.6; }

    .btn-submit {
      width: 100%;
      margin-top: 28px;
      padding: 15px 24px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--white);
      background: linear-gradient(135deg, var(--teal2) 0%, var(--teal) 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform .15s, box-shadow .2s;
      box-shadow: 0 4px 16px rgba(0,119,182,.3);
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,119,182,.4);
    }
    .btn-submit:disabled { opacity: .7; cursor: not-allowed; }
    .btn-submit .arrow { transition: transform .2s; }
    .btn-submit:hover:not(:disabled) .arrow { transform: translateX(4px); }

    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .spinner { display: block; }
    .loading .btn-text, .loading .arrow { display: none; }

    .status-box {
      display: none;
      border-radius: 10px;
      padding: 16px 18px;
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.6;
      align-items: flex-start;
      gap: 12px;
    }
    .status-box.visible { display: flex; }
    .status-box.success { background: #F0FDF4; border: 1px solid #BBF7D0; color: #166534; }
    .status-box.error-box { background: #FFF1F2; border: 1px solid #FECDD3; color: #9F1239; }
    .status-icon { font-size: 18px; flex-shrink: 0; }

    @media (max-width: 900px) {
      .page { grid-template-columns: 1fr; }
      .panel-left { position: static; height: 120px; }
      .panel-right { padding: 40px 28px; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
    }
    @media (max-width: 480px) {
      .form-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- Left panel -->
  <aside class="panel-left">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="logo-name">SimplifIQ</span>
    </div>
    <p class="tagline">AI-powered audits, delivered instantly.</p>
  </aside>

  <!-- Right panel -->
  <main class="panel-right">
    <div class="form-header">
      <h2>Request your free audit</h2>
      <p>Takes 60 seconds. No commitment required.</p>
    </div>

    <div class="form-card">
      <form id="leadForm" novalidate>

        <div class="form-row">
          <div class="field">
            <label for="name">Full Name <span class="req">*</span></label>
            <input type="text" id="name" name="name" placeholder="Jane Smith" autocomplete="name">
            <div class="field-error" id="err-name"></div>
          </div>
          <div class="field">
            <label for="email">Work Email <span class="req">*</span></label>
            <input type="email" id="email" name="email" placeholder="jane@company.com" autocomplete="email">
            <div class="field-error" id="err-email"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="company">Company Name <span class="req">*</span></label>
            <input type="text" id="company" name="company" placeholder="Acme Corp" autocomplete="organization">
            <div class="field-error" id="err-company"></div>
          </div>
          <div class="field">
            <label for="website">Company Website</label>
            <input type="url" id="website" name="website" placeholder="https://acme.com">
            <div class="field-error" id="err-website"></div>
          </div>
        </div>

        <div class="form-row">
          <div class="field">
            <label for="industry">Industry</label>
            <select id="industry" name="industry">
              <option value="">Select industry…</option>
              <option value="SaaS / Software">SaaS / Software</option>
              <option value="Finance / Fintech">Finance / Fintech</option>
              <option value="Healthcare">Healthcare</option>
              <option value="E-commerce / Retail">E-commerce / Retail</option>
              <option value="Consulting / Professional Services">Consulting / Professional Services</option>
              <option value="Manufacturing">Manufacturing</option>
              <option value="Education / EdTech">Education / EdTech</option>
              <option value="Marketing / Advertising">Marketing / Advertising</option>
              <option value="Real Estate">Real Estate</option>
              <option value="Logistics / Supply Chain">Logistics / Supply Chain</option>
              <option value="Legal">Legal</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="role">Your Role</label>
            <input type="text" id="role" name="role" placeholder="Head of Operations">
          </div>
        </div>

        <div class="field">
          <label for="description">Tell us about your business</label>
          <textarea id="description" name="description" placeholder="What does your company do? What are your biggest operational challenges right now?"></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">Get My Free Audit Report</span>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
          <div class="spinner"></div>
        </button>

        <div class="status-box success" id="successBox">
          <span class="status-icon">✅</span>
          <div>
            <strong>Report on its way!</strong><br>
            Your personalised AI Readiness Audit is being generated and will land in your inbox within minutes.
          </div>
        </div>

        <div class="status-box error-box" id="errorBox">
          <span class="status-icon">⚠️</span>
          <div id="errorMsg">Something went wrong. Please try again.</div>
        </div>

      </form>
    </div>
  </main>

</div>

<script>
  const form    = document.getElementById('leadForm');
  const btn     = document.getElementById('submitBtn');
  const success = document.getElementById('successBox');
  const errBox  = document.getElementById('errorBox');
  const errMsg  = document.getElementById('errorMsg');

  function setLoading(on) {
    btn.disabled = on;
    btn.classList.toggle('loading', on);
  }

  function clearErrors() {
    document.querySelectorAll('.field-error').forEach(el => {
      el.textContent = '';
      el.classList.remove('visible');
    });
    document.querySelectorAll('input, select, textarea').forEach(el => el.classList.remove('error'));
  }

  function showFieldError(fieldId, msg) {
    const input = document.getElementById(fieldId);
    const err   = document.getElementById('err-' + fieldId);
    if (input) input.classList.add('error');
    if (err)   { err.textContent = msg; err.classList.add('visible'); }
  }

  function clientValidate(data) {
    let ok = true;
    if (!data.name.trim())  { showFieldError('name', 'Full name is required.'); ok = false; }
    if (!data.email.trim()) { showFieldError('email', 'Email address is required.'); ok = false; }
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      showFieldError('email', 'Please enter a valid email.'); ok = false;
    }
    if (!data.company.trim()) { showFieldError('company', 'Company name is required.'); ok = false; }
    if (data.website && !/^https?:\/\/.+/.test(data.website)) {
      showFieldError('website', 'URL must start with http:// or https://'); ok = false;
    }
    return ok;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();
    success.classList.remove('visible');
    errBox.classList.remove('visible');

    const data = {
      name:        form.name.value,
      email:       form.email.value,
      company:     form.company.value,
      website:     form.website.value,
      industry:    form.industry.value,
      role:        form.role.value,
      description: form.description.value,
    };

    if (!clientValidate(data)) return;

    setLoading(true);
    try {
      const res = await fetch('/submit-lead', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const json = await res.json();

      if (res.ok && json.success) {
        success.classList.add('visible');
        form.reset();
        success.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        if (json.errors && Array.isArray(json.errors)) {
          json.errors.forEach(msg => {
            if (msg.toLowerCase().includes('name'))         showFieldError('name', msg);
            else if (msg.toLowerCase().includes('email'))   showFieldError('email', msg);
            else if (msg.toLowerCase().includes('company')) showFieldError('company', msg);
            else if (msg.toLowerCase().includes('url'))     showFieldError('website', msg);
          });
        } else {
          errMsg.textContent = json.message || 'Something went wrong. Please try again.';
          errBox.classList.add('visible');
        }
      }
    } catch (err) {
      errMsg.textContent = 'Network error — please check your connection and try again.';
      errBox.classList.add('visible');
    } finally {
      setLoading(false);
    }
  });

  document.querySelectorAll('input, select, textarea').forEach(el => {
    el.addEventListener('input', () => {
      el.classList.remove('error');
      const errEl = document.getElementById('err-' + el.id);
      if (errEl) { errEl.textContent = ''; errEl.classList.remove('visible'); }
    });
  });
</script>
</body>
</html>
